services:
  - type: web
    name: canineracks-backend
    env: python
    plan: free
    buildCommand: ""
    startCommand: gunicorn canineracks_backend.wsgi:application

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: canineracks-db
          property: connectionString

databases:
  - name: canineracks-db
    plan: free
